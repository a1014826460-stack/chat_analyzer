{% extends "admin/base.html" %}{% block title %}系统设置{% endblock %}{% block content %}<section class="panel"><h2>服务器 AI</h2><p>配置仅保存在服务器加密数据库中。默认使用 DeepSeek 的 OpenAI 兼容接口。</p><form id="ai-settings-form"><label>提供商<select name="provider"><option value="openai_compatible" selected>OPEN（OpenAI 兼容）</option></select></label><label>接口地址<input name="base_url" value="https://api.deepseek.com/v1" required></label><label>模型<input name="model" value="deepseek-v4-flash" required></label><label>Token<input name="api_key" type="password" autocomplete="new-password" placeholder="首次保存必须填写；已配置时留空保持不变"></label><button>保存 AI 配置</button><button id="ai-test-button" type="button">测试连接</button><p id="ai-settings-result"></p></form></section>{% endblock %}
